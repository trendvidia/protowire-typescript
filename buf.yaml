version: v2
modules:
  # Vendored copies of the protowire annotation extensions. These match
  # `../protowire/proto/{pxf,sbe}/annotations.proto`. The field numbers are
  # part of the cross-port contract and must match canonical exactly: they
  # live in protowire's registered block 1314-1363 (protocolbuffers/protobuf#28919).
  # The former 50000-series was an unregistered squat and is retired.
  - path: proto
  # Test fixtures.
  - path: src/pxf/testdata
  - path: src/sbe/testdata
lint:
  use:
    - STANDARD
  ignore:
    # Vendored annotations match the upstream Go layout (no version suffix);
    # changing the package would break wire compatibility with the canonical
    # protowire repo.
    - proto
    # Test fixtures use kebab-case filenames and per-test packages on
    # purpose so they round-trip cleanly through pxf parsing.
    - src/pxf/testdata
    - src/sbe/testdata
breaking:
  use:
    - FILE
