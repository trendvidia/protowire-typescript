syntax = "proto3";
package google.protobuf;

message Timestamp {
  string seconds = 1;
  int32 nanos = 2;
}

message Duration {
  int64 seconds = 1;
}

message Any {
  string type_url = 1;
  string value = 2;
}

message StringValue {
  repeated string value = 1;
}

message FieldMask {
  string paths = 1;
}
