// A conformant schema for the oneof default rule (#31).
syntax = "proto3";
package bindoneof.v1;

import "pxf/annotations.proto";

message OneDefault {
  oneof choice {
    string a = 1;
    string b = 2 [(pxf.default) = "bbb"];
  }
  optional string kept = 3 [(pxf.default) = "kkk"];
}
